[package]
name = "tracer"
version = "0.2.0"
description = "Tracer - local AI-text detector"
authors = []
edition = "2021"
license = "MIT"
repository = "https://github.com/garethllew/tracerapp"

[lib]
name = "tracer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
anyhow = "1"
tracer-engine = { path = "../crates/tracer-engine" }

# First-run model download (the app's only network access): streamed,
# resumable, SHA-256-pinned. Same crates as Vixer's models.rs.
reqwest = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
# Runtime for the download tests' local HTTP server round-trips.
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
