[package]
name = "tracer"
version = "0.1.0"
description = "Tracer - local AI-text detector"
authors = []
edition = "2021"
license = "MIT"
repository = "https://github.com/garethllew/tracerapp"

[lib]
name = "tracer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
anyhow = "1"
tracer-engine = { path = "../crates/tracer-engine" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
